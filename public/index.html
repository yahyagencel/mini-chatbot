<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>YM Software Group - Live Chat</title>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>

    <style>
        body {
            background-color: #121212 !important; 
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }

        #header {
            background: #1f1f1f;
            width: 100%;
            padding: 15px 30px;
            text-align: center;
            border-bottom: 2px solid #00f2ff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
        }

        #header h1 {
            margin: 0;
            font-size: 20px;
            color: #00f2ff;
        }

        #login-btn {
            background: #4285F4;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        #login-btn:hover {
            background: #357ae8;
        }

        #chat-window {
            width: 80%;
            height: 400px;
            border: 1px solid #333;
            margin-top: 20px;
            overflow-y: scroll;
            background: #1a1a1a;
            padding: 15px;
            border-radius: 8px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .mesaj {
            padding: 8px;
            border-bottom: 1px solid #222;
            color: #00ff66;
            font-family: monospace;
        }

        .input-area {
            margin-top: 15px;
            width: 80%;
            display: flex;
            gap: 10px;
            padding-bottom: 20px;
        }

        input {
            flex-grow: 1;
            padding: 12px;
            background: #222;
            color: white;
            border: 1px solid #444;
            border-radius: 4px;
            outline: none;
        }

        input:focus {
            border-color: #00f2ff;
        }

        button.gonder-btn {
            padding: 10px 25px;
            background: #00f2ff;
            color: #121212;
            border: none;
            cursor: pointer;
            font-weight: bold;
            border-radius: 4px;
        }

        button.gonder-btn:hover {
            background: #00c4d1;
        }
    </style>
</head>
<body>

    <div id="header">
        <h1>YM Software Group Chat</h1>
        <button id="login-btn" onclick="googleGiris()">Google ile Giriş Yap</button>
    </div>

    <div id="chat-window"></div>

    <div class="input-area">
        <input type="text" id="mesaj-kutusu" placeholder="Mesajını yaz ve Enter'a bas...">
        <button class="gonder-btn" onclick="mesajGonder()">Gönder</button>
    </div>

    <script>
        const firebaseConfig = {
            // Firebase config bilgilerin buraya gelecek
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        function googleGiris() {
            const provider = new firebase.auth.GoogleAuthProvider();
            firebase.auth().signInWithPopup(provider)
                .then((result) => {
                    alert("Giriş başarılı, hoş geldin " + result.user.displayName);
                })
                .catch((error) => {
                    alert("Giriş başarısız: " + error.message);
                    console.error(error);
                });
        }

        const inputField = document.getElementById("mesaj-kutusu");
        const chatWindow = document.getElementById("chat-window");

        inputField.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                mesajGonder();
            }
        });

        function mesajGonder() {
            const mesajMetni = inputField.value.trim();
            if (mesajMetni !== "") {
                const yeniMesaj = document.createElement("div");
                yeniMesaj.className = "mesaj";
                yeniMesaj.textContent = "Sen: " + mesajMetni;
                chatWindow.appendChild(yeniMesaj);
                chatWindow.scrollTop = chatWindow.scrollHeight;
                inputField.value = "";
            }
        }
    </script>
</body>
</html>
