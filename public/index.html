<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Chatbot - Google ile Giriş</title>
    <!-- Google Sign-In Kütüphanesi -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 300px; text-align: center; }
        #chat-container { display: none; width: 400px; height: 500px; flex-direction: column; }
        #messages { flex-grow: 1; border: 1px solid #ddd; overflow-y: scroll; padding: 10px; margin-bottom: 10px; background: #fafafa; text-align: left; }
        input, button { padding: 10px; width: 100%; margin-top: 5px; box-sizing: border-box; }
    </style>
</head>
<body>

    <!-- Giriş Ekranı -->
    <div id="login-container" class="card">
        <h2>Mini Chatbot</h2>
        <p>Sohbete başlamak için:</p>
        
        <!-- Google Giriş Butonu -->
        <div id="g_id_onload"
             data-client_id="60287386067-fp674raep5id9q8cokpm5vmgvioibun3.apps.googleusercontent.com"
             data-callback="handleCredentialResponse">
        </div>
        <div class="g_id_signin" data-type="standard"></div>
    </div>

    <!-- Sohbet Ekranı -->
    <div id="chat-container" class="card">
        <h3>Sohbet Odası</h3>
        <div id="messages"></div>
        <input type="text" id="message-input" placeholder="Mesajın...">
        <button onclick="sendMessage()">Gönder</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let userName = "";

        // Google Giriş Cevabını İşle
        function handleCredentialResponse(response) {
            const data = JSON.parse(atob(response.credential.split('.')[1]));
            userName = data.name; // Google'daki ismini alıyoruz
            
            document.getElementById('login-container').style.display = 'none';
            document.getElementById('chat-container').style.display = 'flex';
        }

        function sendMessage() {
            const input = document.getElementById('message-input');
            if(input.value) {
                socket.emit('chat message', { user: userName, text: input.value });
                input.value = '';
            }
        }

        socket.on('chat message', (data) => {
            const msgDiv = document.getElementById('messages');
            msgDiv.innerHTML += `<div><strong>${data.user}:</strong> ${data.text}</div>`;
            msgDiv.scrollTop = msgDiv.scrollHeight;
        });
    </script>
</body>
</html>
