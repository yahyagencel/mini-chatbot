<!DOCTYPE html>
<html lang="tr">
<head>
    <style>
        /* Modern Dark Gaming Teması */
        body {
            background-color: #121212; /* Derin Koyu Gri */
            color: #e0e0e0;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #header {
            background: #1f1f1f;
            width: 100%;
            padding: 15px;
            text-align: center;
            border-bottom: 2px solid #00f2ff; /* Neon Mavi (Teknoloji) */
        }

        /* YM Software Group Özel Başlığı */
        .status-badge {
            font-size: 12px;
            color: #00ff66; /* Minecraft Yeşili */
            margin-top: 5px;
        }

        #chat-window {
            width: 80%;
            height: 400px;
            border: 1px solid #333;
            margin-top: 20px;
            overflow-y: scroll;
            background: #1a1a1a;
            padding: 10px;
        }

        input {
            width: 70%;
            padding: 10px;
            background: #222;
            color: white;
            border: 1px solid #444;
        }

        button {
            padding: 10px 20px;
            background: #00f2ff;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="header">
        <h1>YM Software Group - Live Chat</h1>
        <div class="status-badge">● Sky Factory Server: Online</div>
    </div>

    <div id="chat-window"></div>

    <div style="margin-top: 10px;">
        <input type="text" id="mesaj-kutusu" placeholder="Mesajını yaz...">
        <button onclick="mesajGonder()">Gönder</button>
    </div>

    <script>
        const inputField = document.getElementById("mesaj-kutusu");

        // 1. ENTER TUŞU ÖZELLİĞİ
        inputField.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault(); // Sayfa yenilenmesini engelle
                mesajGonder(); // Gönder fonksiyonunu tetikle
            }
        });

        function mesajGonder() {
            // Buraya kendi gönderim mantığını ekle
            console.log("Mesaj gönderildi: " + inputField.value);
            inputField.value = ""; // Kutuyu temizle
        }
    </script>
</body>
</html>
