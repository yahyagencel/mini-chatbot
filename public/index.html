<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Mini Chatbot</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #313338;
            color: #dbdee1;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #header {
            background-color: #2b2d31;
            padding: 15px 20px;
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
            border-bottom: 1px solid #1f2023;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #header span { color: #5865f2; }
        #user-email-display {
            font-size: 14px;
            color: #949ba4;
            background-color: #1e1f22;
            padding: 6px 12px;
            border-radius: 4px;
        }
        
        #login-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }
        #login-screen input {
            padding: 12px;
            width: 280px;
            background-color: #1e1f22;
            border: none;
            color: white;
            border-radius: 4px;
            outline: none;
        }
        
        #chat-area {
            flex: 1;
            display: none;
            flex-direction: column;
            height: 100%;
        }
        #chat-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            background-color: #2b2d31;
            padding: 10px 15px;
            border-radius: 8px;
            max-width: 70%;
            word-break: break-all;
        }
        .message strong { color: #5865f2; }
        
        /* Yazıyor Göstergesi Alanı */
        #typing-indicator {
            height: 22px;
            padding: 0 20px;
            color: #949ba4;
            font-size: 13px;
            font-style: italic;
            background-color: #313338;
        }

        #emoji-bar {
            background-color: #2b2d31;
            padding: 0 20px 10px 20px;
            display: flex;
            gap: 8px;
        }
        .emoji-btn {
            background-color: #1e1f22;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        .emoji-btn:hover { background-color: #35373c; }

        #form {
            display: flex;
            padding: 0 20px 20px 20px;
            background-color: #2b2d31;
            gap: 10px;
        }
        #username-input {
            width: 150px;
            padding: 10px;
            background-color: #1e1f22;
            border: none;
            color: white;
            border-radius: 4px;
            outline: none;
        }
        #input {
            flex: 1;
            padding: 10px;
            background-color: #1e1f22;
            border: none;
            color: white;
            border-radius: 4px;
            outline: none;
        }
        button[type="submit"] {
            background-color: #5865f2;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button[type="submit"]:hover { background-color: #4752c4; }
    </style>
</head>
<body>

    <div id="header">
        <div>💬 <span>Mini Chatbot</span> - Sohbet Odası</div>
        <div id="user-email-display"></div>
    </div>

    <!-- Giriş Ekranı -->
    <div id="login-screen">
        <h2>Sisteme Kayıt Olmak İçin Gmail'ini Yaz</h2>
        <input type="email" id="email-input" placeholder="ornek@gmail.com" required />
        <button id="login-btn">Devam Et</button>
    </div>

    <!-- Sohbet Ekranı -->
    <div id="chat-area">
        <div id="chat-container"></div>
        
        <!-- Yazıyor Bildirimi -->
        <div id="typing-indicator"></div>

        <div id="emoji-bar">
            <button type="button" class="emoji-btn" onclick="addEmoji('😊')">😊</button>
            <button type="button" class="emoji-btn" onclick="addEmoji('😂')">😂</button>
            <button type="button" class="emoji-btn" onclick="addEmoji('❤️')">❤️</button>
            <button type="button" class="emoji-btn" onclick="addEmoji('👍')">👍</button>
            <button type="button" class="emoji-btn" onclick="addEmoji('🔥')">🔥</button>
            <button type="button" class="emoji-btn" onclick="addEmoji('🎉')">🎉</button>
            <button type="button" class="emoji-btn" onclick="addEmoji('🚀')">🚀</button>
            <button type="button" class="emoji-btn" onclick="addEmoji('😎')">😎</button>
        </div>

        <form id="form">
            <input id="username-input" autocomplete="off" placeholder="İsmin / Kullanıcı Adın" required />
            <input id="input" autocomplete="off" placeholder="Mesaj yaz..." required />
            <button type="submit">Gönder</button>
        </form>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let userEmail = localStorage.getItem('mini_chat_email');
        let savedUsername = localStorage.getItem('mini_chat_username');

        const loginScreen = document.getElementById('login-screen');
        const chatArea = document.getElementById('chat-area');
        const emailInput = document.getElementById('email-input');
        const loginBtn = document.getElementById('login-btn');
        const userEmailDisplay = document.getElementById('user-email-display');
        
        const form = document.getElementById('form');
        const usernameInput = document.getElementById('username-input');
        const input = document.getElementById('input');
        const chatContainer = document.getElementById('chat-container');
        const typingIndicator = document.getElementById('typing-indicator');

        if (userEmail) {
            loginScreen.style.display = 'none';
            chatArea.style.display = 'flex';
            userEmailDisplay.innerText = `📧 ${userEmail}`;
        }

        if (savedUsername) {
            usernameInput.value = savedUsername;
        }

        loginBtn.addEventListener('click', () => {
            const emailVal = emailInput.value.trim();
            if (emailVal && emailVal.includes('@')) {
                localStorage.setItem('mini_chat_email', emailVal);
                userEmail = emailVal;
                loginScreen.style.display = 'none';
                chatArea.style.display = 'flex';
                userEmailDisplay.innerText = `📧 ${userEmail}`;
            } else {
                alert('Lütfen geçerli bir Gmail adresi gir!');
            }
        });

        function addEmoji(emoji) {
            input.value += emoji;
            input.focus();
        }

        // Yazıyor... algılama mantığı
        let typingTimeout;
        input.addEventListener('input', () => {
            const usernameVal = usernameInput.value.trim();
            if (usernameVal) {
                socket.emit('typing', { username: usernameVal });
                
                clearTimeout(typingTimeout);
                typingTimeout = setTimeout(() => {
                    socket.emit('stop typing', { username: usernameVal });
                }, 1500);
            }
        });

        socket.on('typing', (data) => {
            typingIndicator.innerText = `${data.username} yazıyor...`;
        });

        socket.on('stop typing', () => {
            typingIndicator.innerText = '';
        });

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const textVal = input.value.trim();
            const usernameVal = usernameInput.value.trim();

            if (textVal && usernameVal && userEmail) {
                localStorage.setItem('mini_chat_username', usernameVal);
                socket.emit('stop typing', { username: usernameVal });

                socket.emit('chat message', {
                    email: userEmail,
                    username: usernameVal,
                    text: textVal
                });
                input.value = '';
            }
        });

        socket.on('load history', function(messages) {
            chatContainer.innerHTML = '';
            messages.forEach(data => {
                const item = document.createElement('div');
                item.className = 'message';
                item.innerHTML = `<strong>${data.username}:</strong> ${data.text}`;
                chatContainer.appendChild(item);
            });
            chatContainer.scrollTop = chatContainer.scrollHeight;
        });

        socket.on('chat message', function(data) {
            const item = document.createElement('div');
            item.className = 'message';
            item.innerHTML = `<strong>${data.username}:</strong> ${data.text}`;
            chatContainer.appendChild(item);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        });
    </script>
</body>
</html>
