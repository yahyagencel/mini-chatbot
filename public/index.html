<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>YM Software Group - Live Chat</title>
    
    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>

    <style>
        body {
            background-color: #121212 !important; 
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Zorunlu Giriş Ekranı (Kilit Perdesi) */
        #auth-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #121212;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        #auth-overlay h2 {
            color: #00f2ff;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .big-login-btn {
            background: #4285F4;
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .big-login-btn:hover {
            background: #357ae8;
        }

        .big-login-btn:disabled {
            background: #555;
            cursor: not-allowed;
        }

        #app-container {
            display: none; /* Giriş yapılana kadar tamamen gizli */
            width: 100%;
            height: 100%;
            flex-direction: column;
            align-items: center;
        }

        #header {
            background: #1f1f1f;
            width: 100%;
            padding: 15px 30px;
            text-align: center;
            border-bottom: 2px solid #00f2ff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
        }

        #header h1 {
            margin: 0;
            font-size: 20px;
            color: #00f2ff;
        }

        #user-info {
            color: #00ff66;
            font-size: 14px;
            font-weight: bold;
        }

        #chat-window {
            width: 80%;
            height: 400px;
            border: 1px solid #333;
            margin-top: 20px;
            overflow-y: scroll;
            background: #1a1a1a;
            padding: 15px;
            border-radius: 8px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .mesaj {
            padding: 8px;
            border-bottom: 1px solid #222;
            color: #00ff66;
            font-family: monospace;
        }

        .input-area {
            margin-top: 15px;
            width: 80%;
            display: flex;
            gap: 10px;
            padding-bottom: 20px;
        }

        input {
            flex-grow: 1;
            padding: 12px;
            background: #222;
            color: white;
            border: 1px solid #444;
            border-radius: 4px;
            outline: none;
        }

        input:focus {
            border-color: #00f2ff;
        }

        button.gonder-btn {
            padding: 10px 25px;
            background: #00f2ff;
            color: #121212;
            border: none;
            cursor: pointer;
            font-weight: bold;
            border-radius: 4px;
        }

        button.gonder-btn:hover {
            background: #00c4d1;
        }
    </style>
</head>
<body>

    <!-- Giriş Yapılmadıysa Çıkacak Zorunlu Ekran -->
    <div id="auth-overlay">
        <h2>YM Software Group - Erişim İçin Giriş Yapın</h2>
        <button id="login-btn" class="big-login-btn" onclick="googleGiris()">Google ile Giriş Yap</button>
    </div>

    <!-- Giriş Yapılınca Açılacak Ana Sohbet Ekranı -->
    <div id="app-container">
        <div id="header">
            <h1>YM Software Group Chat</h1>
            <div id="user-info"></div>
        </div>

        <div id="chat-window"></div>

        <div class="input-area">
            <input type="text" id="mesaj-kutusu" placeholder="Mesajını yaz ve Enter'a bas...">
            <button class="gonder-btn" onclick="mesajGonder()">Gönder</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD03an0jwwuyW6B14_hSjllpgJD0SXR9U",
            authDomain: "mini-chatbot2.firebaseapp.com",
            projectId: "mini-chatbot2",
            storageBucket: "mini-chatbot2.firebasestorage.app",
            messagingSenderId: "841342705131",
            appId: "1:841342705131:web:4f3aaab909567a968d0dae",
            measurementId: "G-ZW1TNM480H"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const authOverlay = document.getElementById("auth-overlay");
        const appContainer = document.getElementById("app-container");
        const userInfo = document.getElementById("user-info");
        const loginBtn = document.getElementById("login-btn");

        // Oturum durumunu sürekli takip et (Zorunlu Giriş Kontrolü)
        firebase.auth().onAuthStateChanged((user) => {
            if (user) {
                authOverlay.style.display = "none";
                appContainer.style.display = "flex";
                userInfo.textContent = user.displayName;
            } else {
                authOverlay.style.display = "flex";
                appContainer.style.display = "none";
                loginBtn.disabled = false;
                loginBtn.textContent = "Google ile Giriş Yap";
            }
        });

        function googleGiris() {
            loginBtn.disabled = true;
            loginBtn.textContent = "Giriş yapılıyor...";
            
            const provider = new firebase.auth.GoogleAuthProvider();
            firebase.auth().signInWithPopup(provider).catch((error) => {
                alert("Giriş başarısız: " + error.message);
                console.error(error);
                loginBtn.disabled = false;
                loginBtn.textContent = "Google ile Giriş Yap";
            });
        }

        const inputField = document.getElementById("mesaj-kutusu");
        const chatWindow = document.getElementById("chat-window");

        inputField.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                mesajGonder();
            }
        });

        function mesajGonder() {
            const mesajMetni = inputField.value.trim();
            if (mesajMetni !== "") {
                const user = firebase.auth().currentUser;
                const isim = user ? user.displayName : "Misafir";
                
                const yeniMesaj = document.createElement("div");
                yeniMesaj.className = "mesaj";
                yeniMesaj.textContent = isim + ": " + mesajMetni;
                chatWindow.appendChild(yeniMesaj);
                chatWindow.scrollTop = chatWindow.scrollHeight;
                inputField.value = "";
            }
        }
    </script>
</body>
</html>
